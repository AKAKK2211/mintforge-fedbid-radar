name: update-data
on:
  schedule:
    - cron: '30 3 * * *'   # daily 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node data/usa_spending_fetch.mjs 7
      - name: Commit updated awards
        run: |
          git config user.name "mintforge-bot"
          git config user.email "mintforge-bot@users.noreply.github.com"
          git add data/awards_latest.json
          git diff --cached --quiet || (git commit -m "chore: refresh award data $(date -u +%F)" && git push)
